<div
  class="no-players"
  *ngIf="(playerListLength$ | async) === 0; else notEmpty"
>
  <span>{{ 'COMPONENT.PARTY_LIST.NO_OTHER_PLAYERS' | transloco }}</span>
</div>

<ng-template #notEmpty>
  <div class="player-list">
    <table cellspacing="5" cellpadding="5" class="player-list-table">
      <thead class="list-header">
        <tr>
          <th>{{ 'COMPONENT.PARTY_LIST.TABLE_HEADERS.LEVEL' | transloco }}</th>
          <th>Character</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody class="listBody">
        <tr *ngFor="let player of playerList$ | async">
          <td>{{ player.level }}</td>
          <td class="campaign-character">
            <ng-container *ngIf="portraits$ | async as portraits">
              <img *ngIf="portraits.get(player.id) as portrait; else avatarFallback" [src]="portrait" alt="" class="character-avatar">
              <ng-template #avatarFallback><span class="campaign-avatar-fallback character-avatar">{{ player.name.slice(0, 1) || '?' }}</span></ng-template>
            </ng-container>
            <span>{{ player.name }} <small *ngIf="isLocal(player.id)">(You)</small></span>
          </td>
          <td>{{ player.cellName }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-template>

name: Campaign Preview Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/campaign-preview.yml'
      - 'GameFiles/Skyrim/Interface/startmenu.swf'
      - 'Code/client/SkyrimVM64.cpp'
      - 'Code/client/Games/Skyrim/BSGraphics/BSGraphicsRenderer.*'
      - 'Code/client/Services/Generic/Overlay*.cpp'
      - 'Code/client/World.*'
      - 'Code/client/ModCompat/MainMenuBridge.*'
      - 'Code/client/ModCompat/CharacterCheckpoints.*'
      - 'Code/encoding/Messages/CharacterSave.h'
      - 'Code/server/Campaign/CharacterSaveStore.*'

permissions:
  contents: read

concurrency:
  group: campaign-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        skyrim-version: ['latest', '1.6.1170']
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: release
      skyrim-version: ${{ matrix.skyrim-version }}
      upload-build-for-next-job: true
      archive-build-artifacts: true

  build-linux:
    uses: ./.github/workflows/linux.yml
    with:
      build-mode: release
      upload-build-for-next-job: true

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: '{release-asset-linux-*,SkyrimTogether-*}'
          merge-multiple: true

      - name: Validate and stage release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p publish
          version="campaign-preview-${GITHUB_SHA:0:7}"
          echo "PREVIEW_TAG=$version" >> "$GITHUB_ENV"

          for suffix in "" "-sse1.6.1170"; do
            client=(release-files/SkyrimTogether-*-windows-x64"$suffix".zip)
            symbols=(release-files/SkyrimTogether-*-windows-x64"$suffix"-debug-symbols.zip)
            test "${#client[@]}" -eq 1
            test "${#symbols[@]}" -eq 1
            unzip -tq "${client[0]}"
            unzip -Z1 "${client[0]}" > client-entries.txt
            grep -Fxq 'SkyrimTogetherReborn/SkyrimTogether.exe' client-entries.txt
            grep -Fxq 'SkyrimTogetherReborn/SkyrimTogetherServer.exe' client-entries.txt
            grep -Fxq 'SKSE/Plugins/STCheckpointBridge.dll' client-entries.txt
            grep -Fxq 'Interface/startmenu.swf' client-entries.txt
            grep -Fxq 'SkyrimTogetherReborn/LobbySave/STLobbyTest.ess' client-entries.txt
            grep -Fxq 'SkyrimTogetherReborn/LobbySave/STLobbyTest.skse' client-entries.txt
            unzip -tq "${symbols[0]}"
            cp "${client[0]}" "publish/SkyrimTogether-$version-windows-x64$suffix.zip"
            cp "${symbols[0]}" "publish/SkyrimTogether-$version-windows-x64$suffix-debug-symbols.zip"
          done

          for arch in amd64 arm64; do
            archives=(release-files/SkyrimTogetherServer-*-linux-"$arch".tar.gz)
            test "${#archives[@]}" -eq 1
            mkdir -p "server-$arch"
            tar -xzf "${archives[0]}" -C "server-$arch"
            test -x "server-$arch/SkyrimTogetherServer"
            test -s "server-$arch/libSTServer.so"
            test -s "server-$arch/config/STServer.ini"
            (cd "server-$arch" && zip -q -r "../publish/SkyrimTogetherServer-$version-linux-$arch.zip" .)
            unzip -tq "publish/SkyrimTogetherServer-$version-linux-$arch.zip"
            cp "${archives[0]}" "publish/SkyrimTogetherServer-$version-linux-$arch.tar.gz"
          done
          (cd publish && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)

      - name: Publish matching prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite binaries."
            exit 1
          fi
          gh release create "$PREVIEW_TAG" publish/* \
            --target "$GITHUB_SHA" \
            --title "Skyrim Together Server-Owned Characters Preview (${GITHUB_SHA:0:7})" \
            --prerelease \
            --notes "Experimental server-owned characters build from commit $GITHUB_SHA. Includes pipelined compressed checkpoint uploads, incremental downloads, and server-owned character rosters. Includes a source-backed native Play-menu adapter and the bundled Interface/startmenu.swf, F2/Right Ctrl fallback, character slots, native New Game invocation from the character picker with the patched menu, automatic initial save after RaceMenu closes, and server-owned checkpoints. No separate menu patch is needed. If another main-menu mod overrides the bundled SWF, prefer the bundled file or restore your original menu and use the F2 fallback. Windows archives include the client, bundled SKSE checkpoint bridge and Windows dedicated server. Linux server ZIP and tar.gz archives are provided for amd64 and arm64. Install matching builds on all clients and servers; select your Skyrim runtime (1.7.104 or 1.6.1170). SKSE is required for native automation. Existing server INIs explicitly setting bRequireServerSaves=false must be changed to true. Native engine calls are source-backed but not binary-verified or tested in game. Use a fresh test campaign and back up existing saves and journals. Native menu adapter needs in-game validation; save-on-disconnect remains pending."
